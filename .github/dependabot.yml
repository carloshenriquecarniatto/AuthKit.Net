version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /src/angular/authkit-workspace
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # TypeScript and Angular majors need a coordinated workspace upgrade.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*']
      tooling:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
