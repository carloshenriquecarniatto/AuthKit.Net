name: Feature request
description: Propose a capability or a new provider
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should AuthKit behave? Does it change the contract?
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Contract impact
      options:
        - label: This can be implemented without changing contracts/authkit.contract.json
        - label: This requires a contract change on both SDKs
