name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore (NuGet audit is blocking)
        run: dotnet restore AuthKit.slnx

      - name: Build
        run: dotnet build AuthKit.slnx -c Release --no-restore

      - name: Test
        run: dotnet test AuthKit.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Format check
        run: dotnet format AuthKit.slnx --verify-no-changes --no-restore
